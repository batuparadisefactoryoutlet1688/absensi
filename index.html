<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - Sistem Absensi</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="wrapLogin">
    <div class="kartuLogin">
      <h1>Sistem Absensi</h1>
      <p class="subjudul">Silakan login untuk melanjutkan</p>

      <form id="formLogin">
        <label for="inputUsername">Username</label>
        <input type="text" id="inputUsername" autocomplete="username" required>

        <label for="inputPassword">Password</label>
        <input type="password" id="inputPassword" autocomplete="current-password" required>

        <label for="inputPenanda">Penanda Admin</label>
        <select id="inputPenanda" required>
          <option value="" disabled selected>Pilih penanda</option>
          <option value="Admin 1">Admin 1</option>
          <option value="Admin 2">Admin 2</option>
          <option value="Admin 3">Admin 3</option>
          <option value="PCP">PCP</option>
        </select>

        <button type="submit" id="tombolLogin" class="tombolLebar">Login</button>

        <div class="pesan" id="pesanLogin"></div>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
